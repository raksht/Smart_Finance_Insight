<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <title>Login | Smart Finance Insights</title>
    
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/inter/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body, .btn, .form-control {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .btn {
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }
        .card {
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
    </style>
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-lg-5 col-md-7">
            
            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark mb-2">
                        <i class="bi bi-box-arrow-in-right text-primary me-2"></i>Welcome Back
                    </h2>
                    <p class="text-muted">Login to access your financial dashboard.</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 shadow-sm" role="alert">
                                <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="fw-semibold text-muted mb-1 small">Email Address</label>
                        <input type="email" name="email" class="form-control bg-light border-0 py-2" required>
                    </div>

                    <div class="mb-4">
                        <label class="fw-semibold text-muted mb-1 small">Password</label>
                        <input type="password" name="password" class="form-control bg-light border-0 py-2" required>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm">
                        Login
                    </button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span> 
                    <a href="/register" class="fw-bold text-primary text-decoration-none">Register</a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
