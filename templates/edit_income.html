{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 mb-5" style="max-width: 600px;">

    <div class="mb-4">
        <h3 class="fw-bold text-dark"><i class="bi bi-pencil-square text-success me-2"></i>Edit Income</h3>
        <p class="text-muted">Update this income record's source, amount, or date.</p>
    </div>

    <div class="card p-4 shadow-sm border-0 rounded-4">
        <form method="POST">
            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Income Source</label>
                <input type="text" name="source" class="form-control bg-light border-0 py-2" value="{{ income.source }}" required>
            </div>

            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Date</label>
                <input type="date" name="date" class="form-control bg-light border-0 py-2" value="{{ income.date }}" required>
            </div>

            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Amount ({{ currency_symbol }})</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 text-muted">{{ currency_symbol }}</span>
                    <input type="number" step="0.01" name="amount" class="form-control bg-light border-0 py-2" value="{{ income.amount }}" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success px-4 py-2 fw-bold rounded-3 shadow-sm">
                    <i class="bi bi-check-circle me-1"></i> Update Income
                </button>
                <a href="/transactions" class="btn btn-light px-4 py-2 fw-bold rounded-3 text-muted">Cancel</a>
            </div>
        </form>
    </div>

</div>

{% endblock %}
