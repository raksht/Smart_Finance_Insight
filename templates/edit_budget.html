{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 mb-5" style="max-width: 600px;">
    
    <div class="mb-4">
        <h3 class="fw-bold text-dark"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Budget Limit</h3>
        <p class="text-muted">Update your spending category or limit.</p>
    </div>

    <div class="card p-4 shadow-sm border-0 rounded-4">
        <form method="POST">
            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Category</label>
                <select name="category" class="form-select bg-light border-0 py-2" required>
                    <option value="Food" {% if budget.category == 'Food' %}selected{% endif %}>🍔 Food</option>
                    <option value="Travel" {% if budget.category == 'Travel' %}selected{% endif %}>✈️ Travel</option>
                    <option value="Shopping" {% if budget.category == 'Shopping' %}selected{% endif %}>🛍️ Shopping</option>
                    <option value="Bills" {% if budget.category == 'Bills' %}selected{% endif %}>💡 Bills</option>
                    <option value="Education" {% if budget.category == 'Education' %}selected{% endif %}>🎓 Education</option>
                    <option value="Entertainment" {% if budget.category == 'Entertainment' %}selected{% endif %}>🍿 Entertainment</option>
                    <option value="Other" {% if budget.category == 'Other' %}selected{% endif %}>📦 Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Budget Amount ({{ currency_symbol }})</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 text-muted">{{ currency_symbol }}</span>
                    <input type="number" step="0.01" name="amount" class="form-control bg-light border-0 py-2" value="{{ budget.amount }}" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2 fw-bold rounded-3 shadow-sm">
                    <i class="bi bi-check-circle me-1"></i> Update Budget
                </button>
                <a href="/budget" class="btn btn-light px-4 py-2 fw-bold rounded-3 text-muted">Cancel</a>
            </div>
        </form>
    </div>

</div>

{% endblock %}
