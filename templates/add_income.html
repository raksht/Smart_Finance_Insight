{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 mb-5">
    <div class="mb-4">
        <h3 class="fw-bold text-dark"><i class="bi bi-wallet2 text-success me-2"></i>Add Income</h3>
        <p class="text-muted">Record your new earnings and cash flow.</p>
    </div>

    <!-- Upgraded Premium Form (Grid Layout) -->
    <div class="card p-4 shadow-sm border-0 rounded-4 mb-5" style="max-width: 700px;">
        <h5 class="fw-bold text-dark mb-4">Income Details</h5>
        
        <form method="POST" action="/add_income">
            <div class="row g-3">
                
                <div class="col-12">
                    <label class="fw-semibold text-muted mb-1 small">Income Source</label>
                    <input type="text" name="source" class="form-control bg-light border-0 py-2" placeholder="e.g., Salary, Freelance, Gift" required>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold text-muted mb-1 small">Date</label>
                    <input type="date" name="date" class="form-control bg-light border-0 py-2" required>
                </div>

                <div class="col-md-6">
                    <label class="fw-semibold text-muted mb-1 small">Amount ({{ currency_symbol }})</label>
                    <div class="input-group shadow-sm-none">
                        <span class="input-group-text bg-light border-0 text-muted">{{ currency_symbol }}</span>
                        <input type="number" step="0.01" name="amount" class="form-control bg-light border-0 py-2" placeholder="0.00" required>
                    </div>
                </div>

                <div class="col-12 mt-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_recurring" id="isRecurringIncome" value="1">
                        <label class="form-check-label small text-muted" for="isRecurringIncome">Recurring monthly income (e.g. salary - auto-repeats each month)</label>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success px-4 py-2 fw-bold rounded-3 shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Add Income
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>

{% endblock %}
