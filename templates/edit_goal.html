{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 mb-5" style="max-width: 600px;">

    <div class="mb-4">
        <h3 class="fw-bold text-dark"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Goal</h3>
        <p class="text-muted">Update this goal's name, target amount, or deadline.</p>
    </div>

    <div class="card p-4 shadow-sm border-0 rounded-4">
        <form method="POST">
            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Goal Name</label>
                <input type="text" name="name" class="form-control bg-light border-0 py-2" value="{{ goal.goal_name }}" required>
            </div>

            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Target Date</label>
                <input type="date" name="date" class="form-control bg-light border-0 py-2" value="{{ goal.target_date }}" required>
            </div>

            <div class="mb-3">
                <label class="fw-semibold text-muted small mb-1">Target Amount ({{ currency_symbol }})</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 text-muted">{{ currency_symbol }}</span>
                    <input type="number" step="0.01" name="target" class="form-control bg-light border-0 py-2" value="{{ goal.target_amount }}" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2 fw-bold rounded-3 shadow-sm">
                    <i class="bi bi-check-circle me-1"></i> Update Goal
                </button>
                <a href="/goals" class="btn btn-light px-4 py-2 fw-bold rounded-3 text-muted">Cancel</a>
            </div>
        </form>
    </div>

</div>

{% endblock %}
